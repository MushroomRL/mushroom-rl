[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroom-rl"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "tqdm",
    "pygame-ce",
    "av",
    "torch"
]
requires-python = ">=3.11"
authors = [
    { name="Carlo D'Eramo", email="carlo.deramo@gmail.com"}, 
    { name = "Davide Tateo", email = "davide@robot-learning.de" }
]
maintainers = [
  { name = "Davide Tateo", email = "davide@robot-learning.de" }
]
description = "A Python library for Reinforcement Learning experiments."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Reinforcement Learning", "Machine Learning", "Robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dynamic = ["version"]

[project.optional-dependencies]
gymnasium = ["gymnasium"]
atari = ["ale-py", "Pillow", "opencv-python>=4.7"]
minigrid = ["minigrid", "opencv-python>=4.7"]
box2d = ["box2d-py"]
bullet = ["pybullet"]
mujoco = ["mujoco==3.14.0"]
mujoco_warp = ["mujoco-warp<3.15"]
isaacsim = ["isaacsim[all,extscache]>=6.1"]
dm_control = ["dm_control>=1.0.44,<1.0.48"]
monitors = ["pyqtgraph", "PySide6"]
wandb = ["wandb"]
all = ["mushroom-rl[gymnasium,atari,minigrid,mujoco,mujoco_warp,dm_control,monitors,wandb]"]

[project.urls]
Homepage = "https://github.com/MushroomRL"
Documentation = "https://mushroomrl.readthedocs.io/en/latest/"
Repository = "https://github.com/MushroomRL/mushroom-rl"
Issues = "https://github.com/MushroomRL/mushroom-rl/issues"

[tool.setuptools.dynamic]
version = { attr = "mushroom_rl.__version__" }

[tool.setuptools.packages.find]
include = ["mushroom_rl*"]
namespaces = false

[tool.setuptools.package-data]
"mushroom_rl.environments.assets" = ["**/*"]
"mushroom_rl.utils.icons" = ["*.png"]

[tool.setuptools.exclude-package-data]
"mushroom_rl.environments.assets" = ["*.pyc"]
